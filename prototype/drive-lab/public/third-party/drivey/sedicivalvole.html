<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Original Drivey.js — Sedici Valvole bridge</title>
    <link rel="stylesheet" type="text/css" title="main" href="./css/drivey.css" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      #buttonsContainer {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <script src="./lib/theme.js"></script>
    <script type="module">
      import Drivey from "./js/Drivey.js";
      import {
        silhouetteMaterial,
        transparentMaterial,
      } from "./js/materials.js";
      import { Input } from "./js/Input.js";
      import { Color } from "./lib/three/three.module.js";

      const installDualPaletteMaterial = (material) => {
        const singlePaletteShader = material.fragmentShader;
        const singlePaletteRamp = `vec3 color = shade < 0.5
          ? mix(darkTint, fullTint, shade * 2.0)
          : mix(fullTint, lightTint, shade * 2.0 - 1.0);`;
        if (
          !singlePaletteShader.includes("uniform vec3 fullTint;")
          || !singlePaletteShader.includes(singlePaletteRamp)
        ) {
          throw new Error("Sedici Valvole dual-palette shader bridge did not match the pinned Drivey source");
        }
        const dualPaletteShader = singlePaletteShader
          .replace(
            "uniform vec3 fullTint;",
            "uniform vec3 fullTint;\n    uniform vec3 secondaryTint;",
          )
          .replace(
            singlePaletteRamp,
            `vec3 color = shade < 0.34
          ? mix(darkTint, fullTint, shade / 0.34)
          : shade < 0.68
            ? mix(fullTint, secondaryTint, (shade - 0.34) / 0.34)
            : mix(secondaryTint, lightTint, (shade - 0.68) / 0.32);`,
          );
        material.uniforms.secondaryTint = { value: new Color(1, 1, 1) };
        material.fragmentShader = dualPaletteShader;
        material.needsUpdate = true;
      };

      const installPaletteWireframe = (screen) => {
        const background = new Color(0, 0, 0);
        const line = new Color(1, 1, 1);
        const highlight = new Color(1, 1, 1);
        const pass = screen.blueprintPass;
        Object.assign(pass.uniforms, {
          backgroundTint: { value: background },
          lineTint: { value: line },
          highlightTint: { value: highlight },
        });
        pass.material.fragmentShader = `
          precision mediump float;

          uniform sampler2D tDiffuse;
          uniform vec3 backgroundTint;
          uniform vec3 lineTint;
          uniform vec3 highlightTint;
          varying vec2 vUV;

          void main() {
            float edge = clamp(texture2D(tDiffuse, vUV).r * 20.0, 0.0, 1.0);
            float lineStrength = smoothstep(0.10, 0.62, edge);
            float paletteBlend = smoothstep(0.18, 0.82, vUV.y);
            vec3 pairedLine = mix(highlightTint, lineTint, paletteBlend);
            vec3 colour = mix(backgroundTint, pairedLine, lineStrength);
            gl_FragColor = vec4(colour, 1.0);
          }
        `;
        pass.material.needsUpdate = true;
        return Object.freeze({ background, line, highlight });
      };

      const removeEmbeddedPlaylist = () => {
        document.querySelector("#embedded-playlist")?.remove();
      };
      const observer = new MutationObserver(removeEmbeddedPlaylist);
      observer.observe(document.body, { childList: true, subtree: true });

      document.addEventListener("touchmove", (event) => event.preventDefault(), {
        passive: false,
      });

      installDualPaletteMaterial(silhouetteMaterial);
      installDualPaletteMaterial(transparentMaterial);
      const drivey = new Drivey();
      const paletteWireframe = installPaletteWireframe(drivey.screen);
      removeEmbeddedPlaylist();
      window.drivey = drivey;
      window.__SEDICIVALVOLE_DRIVEY__ = Object.freeze({
        Color,
        Input,
        drivey,
        paletteWireframe,
        silhouetteMaterial,
        transparentMaterial,
        upstreamCommit: "5104cdade2a3158786b05b9b0680a50e942830cf",
      });
    </script>
  </body>
</html>
